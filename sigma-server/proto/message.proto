syntax = "proto3";

package sigmapb;

option go_package = "sigma-server/proto;sigmapb";

message Content {
  oneof content {
    DataMessage dataMessage = 1;
    ReceiptMessage receipt = 2;
    TypingMessage typing = 3;
    SyncMessage sync = 4;
  }
}

message DataMessage {
  string body = 1;
  AttachmentPointer attachment = 2;
  Reaction reaction = 3;
  Location location = 4;
  PollCreate pollCreate = 5;
  PollVote pollVote = 6;
  PollTerminate pollTerminate = 7;
}

message PollCreate {
  string question = 1;
  repeated string options = 2;
  bool allow_multiple_votes = 3;
}

message PollVote {
  string target_author_aci = 1;
  uint64 target_sent_timestamp = 2;
  repeated uint32 option_indexes = 3;
  uint32 vote_count = 4;
}

message PollTerminate {
  uint64 target_sent_timestamp = 1;
}

message AttachmentPointer {
  string id = 1;
  bytes key = 2;
  bytes iv = 3;
  bytes digest = 4;
  string fileName = 5;
  uint32 size = 6;
}

message Reaction {
  string emoji = 1;
  bool remove = 2;
  string targetAuthorAci = 3;
  uint64 targetTimestamp = 4;
}

message Location {
  double latitude = 1;
  double longitude = 2;
  string address = 3;
}

// ReceiptMessage para confirmações de entrega/leitura
message ReceiptMessage {
  enum ReceiptType {
    UNKNOWN = 0;
    DELIVERY = 1;  // Delivered
    READ = 2;       // Read
  }
  ReceiptType type = 1;
  string messageId = 2;           // UUID da mensagem sendo confirmada
  string senderId = 3;            // UUID de quem enviou a mensagem original
  uint64 timestamp = 4;           // Timestamp quando foi confirmado
  uint32 messageCount = 5;        // Quantas mensagens confirmadas
}

// TypingMessage para indicadores de digitação
message TypingMessage {
  enum TypingState {
    STARTED = 0;
    STOPPED = 1;
  }
  TypingState state = 1;
  uint64 timestamp = 2;
}

// SyncMessage para sincronização de status/eventos
message SyncMessage {
  enum SyncType {
    UNKNOWN = 0;
    MESSAGE_STATUS_UPDATE = 1;  // Status de mensagem enviada
    THREAD_UPDATE = 2;          // Atualização de thread
    CONTACT_UPDATE = 3;         // Atualização de contato
  }
  SyncType type = 1;
  string messageId = 2;
  int32 status = 3;  // 0=PENDING, 1=SENT, 2=DELIVERED, 3=READ, 4=FAILED
  string error = 4;
  uint64 timestamp = 5;
  repeated string targetIds = 6;  // Para sincronização em grupo
}
