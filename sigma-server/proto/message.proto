syntax = "proto3";

package messaging;

option go_package = "sigma-server/proto;sigmapb";

enum MessageType {
  TEXT = 0;
  IMAGE = 1;
  VIDEO = 2;
  AUDIO = 3;
  POLL = 4;
  REPLY = 5;
  REACTION = 6;
}

enum MessageStatus {
  PENDING = 0;
  SENT = 1;
  DELIVERED = 2;
  READ = 3;
  FAILED = 4;
}

message TextContent {
  string text = 1;
}

message ImageContent {
  string url = 1;
  string thumbnail = 2;
  int32 width = 3;
  int32 height = 4;
}

message VideoContent {
  string url = 1;
  string thumbnail = 2;
  int64 duration = 3;
}

message AudioContent {
  string url = 1;
  int64 duration = 2;
}

message PollOption {
  string id = 1;
  string text = 2;
  int32 votes = 3;
}

message PollContent {
  string question = 1;
  repeated PollOption options = 2;
  bool multipleChoice = 3;
}

message ReplyContent {
  string messageId = 1;
  string previewText = 2;
}

message ReactionContent {
  string messageId = 1;
  string emoji = 2;
}

message PollVote {
  string pollId = 1;
  string optionId = 2;
  string userId = 3;
}

message Message {
  string id = 1;
  string conversationId = 2;
  string senderId = 3;
  string receiverId = 4;

  MessageType type = 5;

  int64 timestamp = 6;
  int64 updatedAt = 7;

  MessageStatus status = 8;

  oneof content {
    TextContent text = 9;
    ImageContent image = 10;
    VideoContent video = 11;
    AudioContent audio = 12;
    PollContent poll = 13;
    ReplyContent reply = 14;
    ReactionContent reaction = 15;
    PollVote pollVote = 16;
  }
}
