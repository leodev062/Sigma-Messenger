syntax = "proto3";

package messaging;

option go_package = "sigma-server/proto;sigmapb";

message Envelope {
  string envelopeId = 1;
  string from = 2;
  string to = 3;
  bytes payload = 4; // Protobuf Message bytes
  string status = 5; // pending | delivered | failed
  int64 createdAt = 6;
  int64 deliverAt = 7;
}
