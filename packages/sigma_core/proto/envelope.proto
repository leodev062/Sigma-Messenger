syntax = "proto3";

package sigmapb;

option go_package = "sigma-server/proto;sigmapb";

message Envelope {
  enum Type {
    TYPE_UNKNOWN = 0;
    CIPHERTEXT = 1;
    PREKEY_BUNDLE = 2;
    RECEIPT = 3;
    TYPING = 4;
    SYNC_MESSAGE = 5;
  }

  Type type = 1;
  string source = 2;
  uint32 source_device = 3;
  uint64 timestamp = 4;
  bytes content = 5;
  bytes signature = 6;          // HMAC para validar integridade
  string clientId = 7;          // ID da mensagem no cliente para deduplicação
  uint32 ttl = 8;               // Time-to-live em segundos (default 86400 = 24h)
  repeated string groupIds = 9; // Para mensagens de grupo
}
