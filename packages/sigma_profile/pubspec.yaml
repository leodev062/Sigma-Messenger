name: sigma_profile
description: Profile management for Sigma Messenger
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  sigma_core:
    path: ../sigma_core
  sigma_auth:
    path: ../sigma_auth
  sigma_database:
    path: ../sigma_database
  provider: ^6.1.5+1
  go_router: ^17.2.3
  sigma_ui:
