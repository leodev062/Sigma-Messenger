name: sigma_chat
description: Chat and Messaging for Sigma Messenger
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  sigma_core:
    path: ../sigma_core
  sigma_database:
    path: ../sigma_database
  sigma_auth:
    path: ../sigma_auth
  sigma_profile:
    path: ../sigma_profile
  sigma_contacts:
    path: ../sigma_contacts
  sigma_settings:
    path: ../sigma_settings
  provider: ^6.1.5+1
  go_router: ^17.2.3
  firebase_messaging: ^16.2.2
  drift: ^2.33.0
  path: ^1.9.0
  intl: ^0.19.0
  freezed_annotation: ^2.4.4
  sigma_ui:
    path: ../sigma_ui
  photo_manager: ^3.9.0
  photo_manager_image_provider: ^2.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.4
  freezed: ^2.5.7
