name: sigma_auth
description: Authentication and Registration for Sigma Messenger
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  sigma_core:
    path: ../sigma_core
  sigma_database:
    path: ../sigma_database
  sigma_chat:
    path: ../sigma_chat
  sigma_profile:
    path: ../sigma_profile
  sigma_contacts:
    path: ../sigma_contacts
  provider: ^6.1.5+1
  go_router: ^17.2.3
  permission_handler: ^12.0.1
  retrofit: ^4.9.2
  dio: ^5.9.2
  json_annotation: ^4.9.0
  multiple_result: ^5.3.0
  firebase_messaging: ^16.2.2
  sms_autofill: ^2.5.0
  phone_numbers_parser: ^9.0.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  retrofit_generator: ^10.2.6
  json_serializable: ^6.9.4
  mockito: ^5.4.4
